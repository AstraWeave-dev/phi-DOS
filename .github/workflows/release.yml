# 打包并发布 Release。
# 用法：GitHub 仓库页面 → Actions → Release → Run workflow，填版本号后运行。
# 它会跑全部测试，用 tools/release.sh 打包五个平台，然后创建标签 v<版本号> 和对应的 Release，
# 把十个 zip 作为附件挂上去。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.0（会创建标签 v0.1.0）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test

      - name: Package
        run: ./tools/release.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: phi-DOS ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: publish/release/*.zip
          body: |
            ## 下载哪个

            | 系统 | 文件 |
            |---|---|
            | Windows 64 位 | `phi-DOS-win-x64.zip` |
            | Windows 32 位 | `phi-DOS-win-x86.zip` |
            | Windows ARM（如 Surface Pro X、骁龙笔记本） | `phi-DOS-win-arm64.zip` |
            | Linux 64 位 | `phi-DOS-linux-x64.zip` |
            | Linux ARM64（如树莓派 4/5 的 64 位系统） | `phi-DOS-linux-arm64.zip` |

            文件名带 `-small` 的是小体积版（约 1MB），需要电脑上装有 [.NET 10 运行时](https://dotnet.microsoft.com/download/dotnet/10.0)；不带的是完整版，自带运行时，解压即用。

            ## 怎么用

            解压后双击 `run-phidos.bat`（Linux 上运行 `./run-phidos.sh`），旁边的 `A` 文件夹会被挂成 A 盘开机。
            输入 `ILDOSVER` 看看系统信息，`EXIT` 退出，F12 重启。
